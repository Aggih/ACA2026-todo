<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arctic Circle 2026 - Todo and more</title>

<style>
:root{
  --blue:#0f4e7a;
  --blue2:#176b94;
  --ice:#7ad7ec;
  --bg:#eef3f5;
  --card:#ffffff;
  --text:#102330;
  --muted:#71818a;

  --red:#c62828;
  --redbg:#fde7e7;

  --purple:#703ca0;
  --purplebg:#efe3fa;

  --green:#26734d;
  --greenbg:#e5f4ea;

  --gold:#a86a00;
  --goldbg:#fff1c9;

  --working:#21789c;
  --workingbg:#dff3fb;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

body{
  display:grid;
  grid-template-rows:90px 1fr;
}

header{
  background:linear-gradient(90deg,var(--blue),var(--blue2));
  border-bottom:4px solid var(--ice);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:245px;
  height:64px;
  object-fit:cover;
  object-position:center;
  border-radius:4px;
}

.clock{
  text-align:right;
  font-size:30px;
  font-weight:900;
}

.date{
  margin-top:4px;
  font-size:11px;
  text-align:right;
  opacity:.9;
  text-transform:uppercase;
}

main{
  min-height:0;
  padding:10px;
  display:grid;
  grid-template-columns:minmax(0,2.75fr) minmax(0,1fr) minmax(0,.72fr);
  grid-template-rows:minmax(0,1fr) 145px;
  gap:10px;
}

.panel{
  background:var(--card);
  border-top:5px solid var(--blue2);
  padding:9px;
  overflow:hidden;
}

.panel h2{
  margin:0 0 7px;
  font-size:16px;
  color:var(--blue);
  text-transform:uppercase;
  letter-spacing:.03em;
}

#todoPanel{
  grid-column:1;
  grid-row:1;
}

#specialPanel{
  grid-column:2;
  grid-row:1;
}

#changesPanel{
  grid-column:3;
  grid-row:1;
}

#crewPanel{
  grid-column:1 / span 3;
  grid-row:2;
}


/* TODO */

.todo-list{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:5px;
  align-content:start;
}

.todo{
  min-width:0;
  min-height:90px;
  height:100%;
  box-sizing:border-box;
  overflow:hidden;
  padding:7px 8px;
  border-left:5px solid var(--ice);
  background:#edf8fb;
}

.todo.completed{
  background:#bfe3c9;
  border-left:7px solid #1f7a45;
}

.todo.completed .status-badge{
  background:#26734d;
  color:#fff;
}

.todo.overdue{
  background:#f3b2b2;
  border-left:7px solid #b71c1c;
}

.todo.overdue .status-badge{
  background:#c62828;
  color:#fff;
}

.todo.start{
  background:#ffd56f;
  border-left:7px solid #a86400;
}

.todo.start .status-badge{
  background:#a86a00;
  color:#fff;
}

.todo.working{
  background:#8fd8f2;
  border-left:7px solid #0078a8;
  box-shadow:inset 0 0 0 1px rgba(0,120,168,.28);
}

.todo.working .status-badge{
  background:#0078a8;
  color:#fff;
}

.todo.old{
  background:#dcc6f3;
  border-left:7px solid #6d32a8;
  box-shadow:inset 0 0 0 1px rgba(109,50,168,.20);
}

.todo.old .status-badge{
  background:#6d32a8;
  color:#fff;
}

.todo-head{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);
  gap:6px;
  align-items:start;
}

.todo-title{
  font-size:11.5px;
  line-height:1.12;
  font-weight:900;
}

.todo-badges{
  display:flex;
  flex-direction:column;
  gap:3px;
  align-items:stretch;
  min-width:0;
}

.status-badge,
.time-badge{
  font-size:7.5px;
  font-weight:900;
  line-height:1.05;
  padding:4px 6px;
}

.status-badge{
  background:#31566c;
  color:#fff;
  max-width:100%;
  white-space:normal;
  overflow-wrap:anywhere;
  text-align:center;
}

.time-badge{
  background:#fff;
  border:1px solid rgba(0,0,0,.18);
}


.todo-timing{
  margin-top:4px;
  display:grid;
  grid-template-columns:1.12fr .88fr .90fr 1.10fr;
  gap:4px;
}

.todo-timebox{
  background:rgba(255,255,255,.78);
  border:1px solid rgba(0,0,0,.14);
  padding:4px 5px;
  min-width:0;
}

.todo-timebox .lbl{
  display:block;
  font-size:6.4px;
  line-height:1;
  font-weight:900;
  color:#5e707a;
  text-transform:uppercase;
  letter-spacing:.04em;
}

.todo-timebox .val{
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-top:2px;
  font-size:8.5px;
  line-height:1.05;
  font-weight:900;
  color:#102330;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.todo.overdue .todo-timebox.finish{
  background:#b71c1c;
  border-color:#b71c1c;
}

.todo.overdue .todo-timebox.finish .lbl,
.todo.overdue .todo-timebox.finish .val{
  color:#fff;
}

.todo.completed .todo-timebox.done{
  background:#26734d;
  border-color:#26734d;
}

.todo.completed .todo-timebox.done .lbl,
.todo.completed .todo-timebox.done .val{
  color:#fff;
}

.todo-info{
  margin-top:4px;
  font-size:7.4px;
  line-height:1.2;
  color:#334b59;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.todo-meta{
  margin-top:3px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:2px 7px;
  font-size:5.8px;
  line-height:1.12;
}

.todo-meta b{
  color:var(--blue);
}



/* SPECIAL REQUIREMENTS */

.specials{
  display:grid;
  grid-template-columns:1fr;
  gap:4px;
  align-content:start;
}

.special{
  padding:5px 6px;
  background:#fff4d7;
  border-left:4px solid #d69b00;
  min-width:0;
}

.special-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
}

.special-room{
  font-weight:900;
  color:#7a5200;
  font-size:8.7px;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.special-time{
  flex:0 0 auto;
  background:#7a5200;
  color:#fff;
  padding:2px 4px;
  font-size:7px;
  font-weight:900;
}

.special-session{
  margin-top:3px;
  font-size:7px;
  font-weight:800;
  color:#59666d;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.special-detail{
  margin-top:3px;
  font-size:7.5px;
  line-height:1.1;
  font-weight:700;
  color:#312600;
}

/* ROOM CHANGES */

.changes{
  display:grid;
  grid-template-columns:1fr;
  gap:5px;
  align-content:start;
}

.change{
  padding:6px;
  background:#f2f8fa;
  border-left:4px solid var(--ice);
  min-width:0;
}

.change-room{
  font-weight:900;
  color:var(--blue);
  font-size:10px;
}

.change-time{
  float:right;
  background:var(--blue);
  color:#fff;
  padding:2px 4px;
  font-size:8px;
}

.change-detail{
  margin-top:3px;
  font-size:8.5px;
  line-height:1.15;
}


/* CREW */

.crew{
  display:grid;
  align-content:start;
  grid-auto-rows:minmax(0,1fr);
  grid-template-columns:repeat(14,minmax(0,1fr));
  gap:4px;
  align-content:start;
}

.crew-card{
  padding:4px 5px;
  background:var(--greenbg);
  border-left:4px solid var(--green);
  min-width:0;
}

.crew-name{
  font-weight:900;
  font-size:8px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.crew-position{
  margin-top:2px;
  font-size:6.2px;
  color:#435760;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.crew-shift{
  margin-top:3px;
  font-size:6.7px;
  line-height:1.12;
}

.crew-time{
  font-weight:900;
  color:var(--green);
}

.empty{
  color:var(--muted);
  font-size:11px;
}

.error{
  color:#b00020;
  font-weight:900;
  font-size:11px;
  background:#fff0f0;
  padding:7px;
  border-left:4px solid #b00020;
}

.statusline{
  position:fixed;
  right:8px;
  bottom:5px;
  font-size:7px;
  color:#78909c;
}

@media (min-width: 2800px) {
  header{
    padding:12px 24px;
  }

  main{
    padding:12px;
    gap:12px;
    grid-template-columns:minmax(0,2.85fr) minmax(0,1fr) minmax(0,.72fr);
    grid-template-rows:minmax(0,1fr) 155px;
  }

  .panel{
    padding:10px;
  }

  .panel h2{
    font-size:20px;
    margin-bottom:8px;
  }

  .todo-list{
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:6px;
  }

  .todo{
    min-height:100px;
    padding:8px 9px;
  }

  .todo-title{
    font-size:13px;
  }

  .todo-info{
    font-size:9px;
  }

  .todo-timebox .lbl{
    font-size:7px;
  }

  .todo-timebox .val{
    font-size:10px;
  }

  .todo-meta{
    font-size:8px;
  }

  .specials{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:6px;
  }

  .special{
    padding:7px 8px;
  }

  .special-room{
    font-size:11px;
  }

  .special-session{
    font-size:8px;
  }

  .special-detail{
    font-size:9px;
  }

  .changes{
    grid-template-columns:1fr;
    gap:5px;
  }

  .crew{
    grid-template-columns:repeat(12,minmax(0,1fr));
    gap:3px;
  }

  .crew-name{
    font-size:9px;
  }

  .crew-meta,
  .crew-shift{
    font-size:7px;
  }
}


.todo-timebox.done .val{
  white-space:normal;
  overflow:visible;
  text-overflow:clip;
  line-height:1.02;
}

</style>
</head>

<div id="statusline" class="statusline"></div>

<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbyEqzfbTs2a9K9qv2Mr6khHrg6gcjWsYTyko02C0YX2bM6kE4J-OrV97dKhp9tfwpQdJg/exec';

const PREVIEW_DATE =
  'null';

const REFRESH_MS =
  30000;


function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[char]);
}

function getDateString() {
  if (PREVIEW_DATE) {
    return PREVIEW_DATE;
  }

  const parts =
    new Intl.DateTimeFormat(
      'en-CA',
      {
        year:'numeric',
        month:'2-digit',
        day:'2-digit',
        timeZone:'Atlantic/Reykjavik'
      }
    ).formatToParts(new Date());

  const p =
    Object.fromEntries(
      parts.map(item => [
        item.type,
        item.value
      ])
    );

  return p.year + '-' + p.month + '-' + p.day;
}


function loadJSONP() {
  return new Promise((resolve,reject) => {

    const callbackName =
      '__arcticData_' +
      Date.now() +
      '_' +
      Math.floor(Math.random()*100000);

    const script =
      document.createElement('script');

    const timeout =
      setTimeout(() => {
        cleanup();
        reject(new Error('Timed out while loading sheet data.'));
      },20000);

    function cleanup() {
      clearTimeout(timeout);

      try {
        delete window[callbackName];
      } catch(e) {}

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }
    }

    window[callbackName] = data => {
      cleanup();

      if (!data || data.ok === false) {
        reject(
          new Error(
            data && data.error
              ? data.error
              : 'Unknown API error'
          )
        );
        return;
      }

      resolve(data);
    };

    script.onerror = () => {
      cleanup();
      reject(new Error('Could not connect to Apps Script API.'));
    };

    script.src =
      API_URL +
      '?callback=' +
      encodeURIComponent(callbackName) +
      '&date=' +
      encodeURIComponent(getDateString()) +
      '&_=' +
      Date.now();

    document.head.appendChild(script);
  });
}


async function loadData() {
  const status =
    document.getElementById('statusline');

  status.textContent =
    'Loading…';

  try {
    const data =
      await loadJSONP();

    renderTodo(data.todo || []);
    renderCrew(data.crew || []);

    if (Object.prototype.hasOwnProperty.call(data, 'specialRequirements')) {
      renderSpecialRequirements(data.specialRequirements || []);
    } else {
      const specialRoot = document.getElementById('specials');
      specialRoot.innerHTML =
        '<div class="empty">Special Requirements API is not deployed yet.</div>';
    }

    renderChanges(data.roomChanges || []);

    status.textContent =
      'Updated ' +
      new Intl.DateTimeFormat(
        'en-GB',
        {
          hour:'2-digit',
          minute:'2-digit',
          second:'2-digit',
          hour12:false,
          timeZone:'Atlantic/Reykjavik'
        }
      ).format(new Date());

  } catch(error) {

    const message =
      error && error.message
        ? error.message
        : String(error);

    const errorHTML =
      '<div class="error">' +
      esc(message) +
      '</div>';

    document.getElementById('todo').innerHTML = errorHTML;
    document.getElementById('crew').innerHTML = errorHTML;
    document.getElementById('specials').innerHTML = errorHTML;
    document.getElementById('changes').innerHTML = errorHTML;

    status.textContent =
      'Data error';
  }
}



function timeToMinutesClient(value) {
  const match = String(value || '').match(/(\d{1,2}):(\d{2})/);

  if (!match) {
    return null;
  }

  return Number(match[1]) * 60 + Number(match[2]);
}


function currentMinutesReykjavik() {
  const parts = new Intl.DateTimeFormat(
    'en-GB',
    {
      hour:'2-digit',
      minute:'2-digit',
      hour12:false,
      timeZone:'Atlantic/Reykjavik'
    }
  ).formatToParts(new Date());

  const p = Object.fromEntries(
    parts.map(x => [x.type, x.value])
  );

  return Number(p.hour) * 60 + Number(p.minute);
}


function getTodoClass(item) {
  const status = String(item.status || '')
    .trim()
    .toLowerCase();

  const displayDate = getDateString();
  const taskDate = String(item.date || '').trim();

  const nowMinutes = currentMinutesReykjavik();
  const startMinutes = timeToMinutesClient(item.startAt);
  const finishMinutes = timeToMinutesClient(item.finishBefore);

  // Completed always wins.
  if (
    status === 'completed' ||
    status === 'completed!' ||
    status === 'done' ||
    status === 'finished'
  ) {
    return 'completed';
  }

  // Older unfinished task = purple.
  if (
    taskDate &&
    displayDate &&
    taskDate < displayDate
  ) {
    return 'old';
  }

  // Clock-based states only apply to the date currently shown.
  if (
    taskDate &&
    displayDate &&
    taskDate === displayDate
  ) {

    // Past FINISH BEFORE = red.
    if (
      finishMinutes !== null &&
      nowMinutes > finishMinutes
    ) {
      return 'overdue';
    }

    // Someone is working on it = light blue.
    if (
      status.includes('working') ||
      status.includes('someone is working') ||
      status.includes('some one is working') ||
      status.includes('in progress')
    ) {
      return 'working';
    }

    // DO IT AT reached/passed = gold.
    if (
      startMinutes !== null &&
      nowMinutes >= startMinutes
    ) {
      return 'start';
    }
  }

  return 'normal';
}


function formatTaskDate(value) {
  const text = String(value || '').trim();

  if (!text) {
    return '—';
  }

  const m = text.match(/^(\d{4})-(\d{2})-(\d{2})$/);

  if (!m) {
    return text;
  }

  const d = new Date(
    Number(m[1]),
    Number(m[2]) - 1,
    Number(m[3]),
    12,0,0
  );

  return new Intl.DateTimeFormat(
    'en-GB',
    {
      weekday:'short',
      day:'numeric',
      month:'short',
      timeZone:'Atlantic/Reykjavik'
    }
  ).format(d).toUpperCase();
}


function formatCompletedAt(value) {
  const text = String(value || '').trim();

  if (!text) {
    return '';
  }

  const m = text.match(
    /^(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})/
  );

  if (!m) {
    return text;
  }

  const datePart =
    `${m[1]}-${m[2]}-${m[3]}`;

  return (
    formatTaskDate(datePart) +
    ' ' +
    String(m[4]).padStart(2,'0') +
    ':' +
    m[5]
  );
}


function renderTodo(items) {
  const root =
    document.getElementById('todo');

  if (!items.length) {
    root.innerHTML =
      '<div class="empty">No tasks for this date.</div>';
    return;
  }

  root.innerHTML =
    items.map(item => {

      const doneAt =
        formatCompletedAt(item.completedAt);

      return `

      <article class="todo ${esc(getTodoClass(item))}">

        <div class="todo-head">

          <div class="todo-title">
            ${esc(item.topic)}
          </div>

          <div class="todo-badges">

            <span class="status-badge">
              ${esc(item.status || 'ACTIVE')}
            </span>

          </div>

        </div>

        ${
          item.info
            ? `
              <div class="todo-info">
                ${esc(item.info)}
              </div>
            `
            : ''
        }

        <div class="todo-timing">

          <div class="todo-timebox date">
            <span class="lbl">DAY</span>
            <span class="val">
              ${esc(formatTaskDate(item.date))}
            </span>
          </div>

          <div class="todo-timebox do">
            <span class="lbl">DO AT</span>
            <span class="val">
              ${esc(item.startAt || item.time || '—')}
            </span>
          </div>

          <div class="todo-timebox finish">
            <span class="lbl">FINISH BY</span>
            <span class="val">
              ${esc(item.finishBefore || '—')}
            </span>
          </div>

          <div class="todo-timebox done">
            <span class="lbl">DONE AT</span>
            <span class="val">
              ${esc(doneAt || '—')}
            </span>
          </div>

        </div>

        <div class="todo-meta">

          ${
            item.completedBy
              ? `
                <div>
                  <b>Done by:</b>
                  ${esc(item.completedBy)}
                </div>
              `
              : ''
          }

          ${
            item.setBy
              ? `
                <div>
                  <b>Set by:</b>
                  ${esc(item.setBy)}
                </div>
              `
              : ''
          }

        </div>

      </article>

    `;
    }).join('');
}


function renderCrew(items) {
  const root =
    document.getElementById('crew');

  if (!items.length) {
    root.innerHTML =
      '<div class="empty">No crew scheduled for this date.</div>';
    return;
  }

  root.innerHTML =
    items.map(item => `

      <div class="crew-card">

        <div class="crew-name">
          ${esc(item.name)}
        </div>

        <div class="crew-position">

          ${esc(item.position || '')}

          ${
            item.room
              ? ' · ' + esc(item.room)
              : ''
          }

        </div>

        <div class="crew-shift">

          <b>
            ${esc(item.what || 'Duty')}
          </b>

          <br>

          <span class="crew-time">
            ${esc(item.in || '—')}
            –
            ${esc(item.out || '—')}
          </span>

        </div>

      </div>

    `).join('');
}



function renderSpecialRequirements(items) {
  const root =
    document.getElementById('specials');

  if (!items.length) {
    root.innerHTML =
      '<div class="empty">No special requirements.</div>';
    return;
  }

  root.innerHTML =
    items.map(item => `

      <div class="special">

        <div class="special-head">

          <div class="special-room">
            ${esc(item.room)}
          </div>

          <span class="special-time">
            ${esc(item.time || '—')}
          </span>

        </div>

        ${
          item.session
            ? `
              <div class="special-session">
                ${esc(item.session)}
              </div>
            `
            : ''
        }

        <div class="special-detail">
          ${esc(item.requirement)}
        </div>

      </div>

    `).join('');
}


function renderChanges(items) {
  const root =
    document.getElementById('changes');

  if (!items.length) {
    root.innerHTML =
      '<div class="empty">No room changes.</div>';
    return;
  }

  root.innerHTML =
    items.map(item => `

      <div class="change">

        <span class="change-time">
          ${esc(item.time)}
        </span>

        <div class="change-room">
          ${esc(item.room)}
        </div>

        <div class="change-detail">
          ${esc(item.from)}
          →
          <b>${esc(item.to)}</b>
        </div>

      </div>

    `).join('');
}


function updateClock() {
  const now =
    new Date();

  document.getElementById('clock').textContent =
    new Intl.DateTimeFormat(
      'en-GB',
      {
        hour:'2-digit',
        minute:'2-digit',
        second:'2-digit',
        hour12:false,
        timeZone:'Atlantic/Reykjavik'
      }
    ).format(now);

  document.getElementById('date').textContent =
    new Intl.DateTimeFormat(
      'en-GB',
      {
        weekday:'long',
        day:'2-digit',
        month:'long',
        year:'numeric',
        timeZone:'Atlantic/Reykjavik'
      }
    ).format(now);
}


updateClock();
loadData();

setInterval(updateClock,1000);
setInterval(loadData,REFRESH_MS);

</script>

</body>
</html>
